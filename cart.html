<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GroceLiver | Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-shell">
        <a class="brand" href="index.html" aria-label="GroceLiver home">
          <span class="brand-mark">G</span>
          <span>GroceLiver</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="cart.html">Cart</a>
          <a href="orders.html">Orders</a>
        </nav>

        <div class="nav-actions">
          <a id="login-link" class="nav-link" href="login.html">Login</a>
          <a class="button button-primary" href="products.html">Continue shopping</a>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <div class="container">
        <div class="page-heading">
          <p class="eyebrow">Your market basket</p>
          <h1>Your cart</h1>
          <p>Check your picks before you head to checkout.</p>
        </div>
        <div class="checkout-layout cart-layout">
          <section id="cart-items"></section>
          <aside id="cart-summary"></aside>
        </div>
      </div>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
