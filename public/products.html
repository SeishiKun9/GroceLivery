<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GroceLiver | Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav-shell">
        <a class="brand" href="index.html" aria-label="GroceLiver home">
          <span class="brand-mark">G</span>
          <span>GroceLiver</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="cart.html">Cart</a>
          <a href="orders.html">Orders</a>
        </nav>

        <div class="nav-actions">
          <a id="login-link" class="nav-link" href="login.html">Login</a>
          <a class="button button-primary" href="cart.html">Cart <span id="cart-count">0</span></a>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <div class="container">
        <div class="page-heading">
          <p class="eyebrow">Good things for your kitchen</p>
          <h1>Shop groceries</h1>
          <p>Everyday favorites and fresh picks, all in one place.</p>
        </div>
        <div class="toolbar">
          <div class="search-box">
            <input id="product-search" type="search" placeholder="Search groceries..." aria-label="Search groceries" />
          </div>
          <div class="filter-group">
            <label for="category-filter">Category</label>
            <select id="category-filter">
              <option value="all">All</option>
              <option value="Fruits">Fruits</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Dairy">Dairy</option>
              <option value="Bakery">Bakery</option>
              <option value="Pantry">Pantry</option>
              <option value="Beverages">Beverages</option>
              <option value="Cooking">Cooking</option>
            </select>
          </div>
        </div>

        <div id="product-grid" class="product-grid"></div>
      </div>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
